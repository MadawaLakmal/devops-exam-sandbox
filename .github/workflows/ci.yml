name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/madawalakmal/devops-exam-sandbox

jobs:
  lint-and-scan:
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint - Dockerfile lint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Bandit - Python security lint
        run: |
          pip install --user bandit
          python3 -m bandit -r app/ -ll

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy - image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  sign:
    needs: lint-and-scan
    runs-on: [self-hosted, vm]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, via GitHub OIDC)
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_NAME }}:${{ github.sha }} | cut -d'@' -f2)
          cosign sign --yes ${{ env.IMAGE_NAME }}@${DIGEST}

      - name: Verify signature
        run: |
          cosign verify ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --certificate-identity-regexp "https://github.com/MadawaLakmal/devops-exam-sandbox/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
